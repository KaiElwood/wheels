services:
  postgres:
    image: postgres:16-alpine
    container_name: kaizen-wheels-postgres
    environment:
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizen
      POSTGRES_DB: kaizen_wheels
    ports:
      - "5432:5432"
    volumes:
      - kaizen-wheels-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen -d kaizen_wheels"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaizen-wheels-postgres:
